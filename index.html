<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Твоё тепло</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>💖 Твоё тепло</h1>
            <button id="themeBtn">🌙</button>
        </header>

        <nav>
            <button class="nav-btn active" data-page="home">🏠</button>
            <button class="nav-btn" data-page="days">📅</button>
            <button class="nav-btn" data-page="messages">💌</button>
            <button class="nav-btn" data-page="playlist">🎵</button>
        </nav>

        <main>
            <section id="page-home" class="page active">
                <h2>Привет, <span id="herName">Любимая</span> ❤️</h2>
                <p>Ты — самое тёплое, что есть в моей жизни.</p>
                <div class="heart">❤️</div>
                <button id="randomBtn" class="btn">Скажи что-то тёплое</button>
                <p id="randomMsg" class="msg-box"></p>
            </section>

            <section id="page-days" class="page">
                <h2>Мы знакомы</h2>
                <div class="days-number" id="daysCount">0</div>
                <p>дней ❤️</p>
            </section>

            <section id="page-messages" class="page">
                <h2>Любовные сообщения</h2>
                <button id="loveBtn" class="btn">Новое сообщение</button>
                <p id="loveMsg" class="msg-box">Нажми, чтобы получить тепло</p>
            </section>

            <section id="page-playlist" class="page">
                <h2>🎵 Плейлист для тебя</h2>
                <ul class="playlist">
                    <li>Песня первая</li>
                    <li>Песня вторая</li>
                    <li>Песня третья</li>
                </ul>
            </section>
        </main>

        <footer>Сделано с теплом ❤️</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
